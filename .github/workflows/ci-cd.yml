name: CI/CD

on:
  pull_request:
    branches: [main, develop, "sprint_*"]
  push:
    # Ramas de trabajo del equipo: feature/..., fix/..., qa/... y las de historias US-XX...
    branches: [main, develop, "sprint_*", "feature/**", "fix/**", "qa/**", "US-**", "Pipeline-CI/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres desechable: así la prueba de concurrencia de US-09 corre de verdad en CI
    # (sin DATABASE_URL se omitiría).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: canchaya_test
          POSTGRES_USER: canchaya
          # Contraseña distinta en cada ejecución: la base es desechable y no hay credenciales en el repo.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canchaya -d canchaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://canchaya:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/canchaya_test
      JWT_SECRET: secreto-solo-para-ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint --if-present
      - name: Validar la especificación OpenAPI (Spectral)
        run: npm run docs:lint
      - name: Cobertura de la documentación de la API (mínimo 90 %)
        run: npm run docs:cobertura
      - name: Aplicar esquema a la base de pruebas
        run: npm run migrate
      - name: Pruebas con cobertura
        run: |
          mkdir -p reports
          npm test -- --coverage --ci --json --outputFile=reports/jest-results.json

      - name: Empaquetar reportes
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/backend-reports"
          cp coverage/lcov.info "$GITHUB_WORKSPACE/artifacts/backend-reports/lcov.info"
          cp reports/jest-results.json "$GITHUB_WORKSPACE/artifacts/backend-reports/jest-results.json"

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-reports
          if-no-files-found: error
          path: artifacts/backend-reports/

  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Empaquetar reporte de cobertura
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/frontend-reports"
          cp coverage/lcov.info "$GITHUB_WORKSPACE/artifacts/frontend-reports/lcov.info"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-reports
          if-no-files-found: error
          path: artifacts/frontend-reports/

  quality-gate:
    name: SonarQube Quality Gate
    needs: [backend, frontend]
    if: always() && needs.backend.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # El servidor de SonarQube lo aloja el equipo y puede estar apagado (por ejemplo, un túnel de ngrok
      # cerrado). Si no responde, el análisis se omite con un aviso en lugar de fallar y bloquear Docker y
      # el despliegue. Si responde, el Quality Gate sigue siendo obligatorio.
      - name: Comprobar que el servidor de SonarQube responde
        id: sonar
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          omitir() {
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SonarQube omitido::$1"
            echo "### SonarQube omitido" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            omitir "Faltan la variable SONAR_HOST_URL o el secreto SONAR_TOKEN del repositorio."
            exit 0
          fi
          servidor="${SONAR_HOST_URL%/}"
          version="$(curl -fsS --max-time 20 "$servidor/api/server/version" 2>/dev/null || true)"
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+'; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube $version responde en $servidor"
          else
            omitir "El servidor $servidor no respondió con su versión (¿SonarQube o el túnel de ngrok están apagados?). Se omite el análisis de esta ejecución."
          fi

      - uses: actions/checkout@v5
        if: steps.sonar.outputs.disponible == 'true'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        if: steps.sonar.outputs.disponible == 'true'
        with:
          name: backend-reports
          path: artifacts-descarga/backend-reports

      - uses: actions/download-artifact@v5
        if: steps.sonar.outputs.disponible == 'true'
        with:
          name: frontend-reports
          path: artifacts-descarga/frontend-reports

      - uses: actions/setup-node@v5
        if: steps.sonar.outputs.disponible == 'true'
        with:
          node-version: "22"

      - name: Alinear el LCOV con la raíz
        if: steps.sonar.outputs.disponible == 'true'
        run: |
          mkdir -p backend/coverage frontend/coverage
          cp artifacts-descarga/backend-reports/lcov.info backend/coverage/lcov.info
          node scripts/ci/prefijar-lcov.mjs backend/coverage/lcov.info backend/coverage/lcov.sonar.info backend/
          cp artifacts-descarga/frontend-reports/lcov.info frontend/coverage/lcov.info
          node scripts/ci/prefijar-lcov.mjs frontend/coverage/lcov.info frontend/coverage/lcov.sonar.info frontend/

      - name: Análisis y espera del Quality Gate
        if: steps.sonar.outputs.disponible == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  docker:
    name: Docker - build y smoke test
    needs: [backend, frontend, quality-gate]
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: secreto-solo-para-ci
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Construir y levantar servicios
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      # US-18: prueba de carga con 100 sockets. La base de este job es desechable, así que
      # se cargan ahí las canchas de ejemplo (el seed borra las canchas existentes).
      - name: Cargar canchas de ejemplo en la base temporal
        run: docker compose exec -T backend node src/seed/seedCanchas.js

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prueba de carga de sockets (100 conexiones)
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run test:carga
        env:
          API_URL: http://localhost:4100/api
          CLIENTES: "100"

      - name: Logs de los servicios
        if: failure()
        run: docker compose logs

      - name: Bajar servicios
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------------------------------------------
  # Despliegue en la nube (US-22 a US-26). Se activa creando la variable de repositorio DESPLIEGUE_NUBE=true cuando
  # Vercel y Railway ya están configurados; mientras tanto estos jobs no corren.
  #
  # Producción = rama sprint_5. Solo se llega aquí si backend, frontend, Quality Gate y Docker pasaron (needs).
  #  - Frontend: por defecto lo publica la integración Git de Vercel al fusionar en sprint_5. Para que Vercel NO
  #    publique antes de que pasen los chequeos, activar el modo pipeline: añadir a frontend/vercel.json
  #    "git": {"deploymentEnabled": {"sprint_5": false}}, crear la variable DESPLIEGUE_VERCEL_POR_PIPELINE=true y los
  #    secretos de Vercel; entonces este job despliega con la CLI solo si todo está en verde.
  #  - Backend: Render (o Railway) despliega desde GitHub con "After CI Checks Pass" (Railway: "Wait for CI"), que
  #    espera a que este mismo workflow termine en verde.
  # Los PR y las demás ramas generan previews en Vercel mediante su integración Git.
  # ---------------------------------------------------------------------------------------------------------------
  desplegar-frontend:
    name: Vercel - despliegue de producción (modo pipeline)
    needs: [backend, frontend, quality-gate, docker]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/sprint_5' && vars.DESPLIEGUE_NUBE == 'true' && vars.DESPLIEGUE_VERCEL_POR_PIPELINE == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Las variables de entorno de producción (VITE_API_URL, ...) las guarda Vercel; no están en el repositorio.
      - name: Traer la configuración del proyecto de Vercel
        run: npx --yes vercel@41 pull --yes --environment=production

      - name: Compilar con el comando de producción
        run: npx --yes vercel@41 build --prod

      - name: Publicar en producción
        run: |
          url="$(npx --yes vercel@41 deploy --prebuilt --prod)"
          echo "### Frontend desplegado" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit ${GITHUB_SHA::7}: $url" >> "$GITHUB_STEP_SUMMARY"

  verificar-produccion:
    name: Pruebas de humo en producción
    needs: [backend, frontend, quality-gate, docker]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/sprint_5' && vars.DESPLIEGUE_NUBE == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_URL: ${{ vars.PROD_API_URL }}
      WEB_URL: ${{ vars.PROD_WEB_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts

      # El backend tarda unos minutos en construirse y reemplazarse (y, en Render gratuito, en despertar): se espera a que /api/health informe
      # el commit de este push (campo "version") antes de probar, para no probar la versión anterior.
      - name: Esperar a que el backend sirva este commit
        run: |
          esperado="${GITHUB_SHA::7}"
          for intento in $(seq 1 60); do
            version="$(curl -fsS --max-time 10 "$API_URL/health" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)"
            echo "Intento $intento: la API informa la versión '${version:-?}' y se espera '$esperado'"
            [ "$version" = "$esperado" ] && exit 0
            sleep 15
          done
          echo "::error title=El backend no desplegó este commit::Tras 15 minutos la API no informa la versión $esperado. Revisa el despliegue en Render/Railway."
          exit 1

      # Con el despliegue directo de Vercel, la reescritura de rutas nueva tarda un momento en estar en línea: una ruta
      # interna que responde 200 indica que ya está publicada la versión con vercel.json.
      - name: Esperar a que Vercel sirva la versión nueva del frontend
        run: |
          for intento in $(seq 1 40); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$WEB_URL/ruta-de-comprobacion" || true)"
            echo "Intento $intento: ruta interna -> HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 15
          done
          echo "::error title=Vercel no publicó la reescritura de rutas::Una ruta interna sigue dando 404 tras 10 minutos. Revisa el despliegue en Vercel."
          exit 1

      - name: Pruebas de humo (registro, login, canchas, socket, disponibilidad, reserva y duplicada)
        env:
          EVIDENCIA_ARCHIVO: ${{ github.workspace }}/evidencia/humo-produccion.md
        run: npm run smoke:produccion

      - name: Publicar la evidencia
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: humo-produccion
          path: evidencia/
          if-no-files-found: ignore

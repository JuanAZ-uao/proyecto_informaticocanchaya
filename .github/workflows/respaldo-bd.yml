name: Respaldo de la base de datos

# US-23. Respaldo diario de la base de PostgreSQL de producción (Neon, o Railway si se usa) con pg_dump. En cada ejecución, además, se RESTAURA el
# respaldo en una base temporal y se comparan las tablas con la original: así la restauración queda probada a diario
# y no solo el día que se necesita.
#
# Secretos del repositorio:
#   BACKUP_DATABASE_URL  cadena de conexión DIRECTA (sin -pooler) del PostgreSQL de producción. En Railway: DATABASE_PUBLIC_URL.
#   BACKUP_PASSPHRASE    clave para cifrar el archivo (el respaldo tiene datos personales). Guardarla en un gestor de claves.
# Variable del repositorio: DESPLIEGUE_NUBE=true y PG_VERSION = versión mayor de PostgreSQL del servidor (Neon: 18).
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 en Colombia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-bd
  cancel-in-progress: false

jobs:
  respaldo:
    name: Respaldar y probar la restauración
    if: vars.DESPLIEGUE_NUBE == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que el servidor de Neon: un respaldo de una versión más nueva no se restaura en una más vieja.
        image: postgres:${{ vars.PG_VERSION || '18' }}-alpine
        env:
          POSTGRES_DB: restauracion
          POSTGRES_USER: canchaya
          # Base desechable: contraseña distinta en cada ejecución.
          POSTGRES_PASSWORD: resp-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canchaya -d restauracion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_VERSION: ${{ vars.PG_VERSION || '18' }}
      ORIGEN_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      DESTINO_URL: postgresql://canchaya:resp-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/restauracion
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar los secretos
        run: |
          [ -n "$ORIGEN_URL" ] || { echo "::error::Falta el secreto BACKUP_DATABASE_URL"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; exit 1; }

      # El cliente de PostgreSQL debe ser de la misma versión (o más nueva) que el servidor de Railway.
      - name: Instalar el cliente de PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}"

      - name: Respaldar
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: bash ./scripts/respaldo/respaldar.sh respaldo.dump

      - name: Probar la restauración en una base temporal
        env:
          DATABASE_URL: postgresql://canchaya:resp-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/restauracion
        run: |
          bash ./scripts/respaldo/restaurar.sh respaldo.dump
          bash ./scripts/respaldo/verificar-restauracion.sh | tee "$GITHUB_STEP_SUMMARY"

      - name: Cifrar el respaldo
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in respaldo.dump -out "respaldo-$(date -u +%Y%m%d).dump.enc" -pass env:BACKUP_PASSPHRASE

      - name: Guardar el respaldo cifrado (14 días)
        uses: actions/upload-artifact@v5
        with:
          name: respaldo-bd
          path: "*.dump.enc"
          retention-days: 14
          if-no-files-found: error

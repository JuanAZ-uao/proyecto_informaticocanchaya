sonar.projectKey=canchaya
sonar.projectName=CanchaYa
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.inclusions=backend/src/**/*.js,frontend/src/**/*.js,frontend/src/**/*.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,backend/src/seed/**

sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/tests/**/*.test.js,frontend/tests/**/*.test.jsx

sonar.coverage.exclusions=backend/src/seed/**,backend/src/server.js,backend/src/db/migrate.js,frontend/src/main.jsx,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.sonar.info,frontend/coverage/lcov.sonar.info
sonar.scm.provider=git
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300